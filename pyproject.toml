[project]
name = "riskengine"
version = "0.1.0"
description = "Portfolio risk analytics and allocation engine for Indian equities"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "yfinance>=0.2.40",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "lightgbm>=4.3",
    "arch>=6.3",
    "tqdm>=4.66",
    "tabulate>=0.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
